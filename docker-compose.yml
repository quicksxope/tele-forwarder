services:
  forwarder:
    build: .
    container_name: tele-forwarder
    restart: unless-stopped
    # Run as the host user so files in ./data/ are owned by you, not root.
    # Set UID/GID in .env or prefix the command:
    #   UID=$(id -u) GID=$(id -g) docker compose up -d
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/data
    environment:
      TELE_FORWARDER_DATA_DIR: /data
